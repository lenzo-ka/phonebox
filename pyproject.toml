[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonebox"
version = "0.2.0"
description = "Fast, lightweight grapheme-to-phoneme conversion using decision trees"
readme = "README.md"
authors = [
    {name = "Kevin Lenzo (lenzo-ka)"},
]
license = "BSD-2-Clause AND Unicode-3.0"
license-files = ["LICENSE", "LICENSE-UNICODE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
keywords = ["g2p", "grapheme-to-phoneme", "pronunciation", "phonetics", "speech", "nlp", "phonebox"]
requires-python = ">=3.11"
dependencies = [
    "cartlet>=0.5.0",
    # icukit supplies the icu module through its binary backend. The pinned
    # 78.3.0 backend has macOS arm64 and Linux x86_64/aarch64 wheels, but no
    # Windows/Intel macOS wheels or sdist; full installation needs a wheel
    # compatible with the chosen platform and Python version.
    # The full runtime uses ICU to execute locale transliteration rules during
    # training and to replay saved raw-rule snapshots. Standalone bundles use
    # the separate portable preprocessing path.
    "icukit>=0.1.2",
]

[project.optional-dependencies]
config = [
    "PyYAML>=6.0",
]
sklearn = [
    "cartlet[sklearn]>=0.5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "build>=1.0",
    "twine>=5.0",
    "setuptools>=77.0",
    "wheel",
    "PyYAML>=6.0",
    "icukit==0.4.0",
    "icukit-pyicu==78.3.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=0.18",
]
viz = [
    "graphviz>=0.20",
    "matplotlib>=3.5.0",
]

[project.urls]
"Homepage" = "https://github.com/lenzo-ka/phonebox"
"Bug Reports" = "https://github.com/lenzo-ka/phonebox/issues"
"Source" = "https://github.com/lenzo-ka/phonebox"

[project.scripts]
phonebox = "phonebox.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phonebox*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
phonebox = ["py.typed"]
"phonebox.config" = ["exemplars.json"]
"phonebox.config.locales" = ["**/*.json", "**/*.xlit"]
"phonebox.configs" = ["*.yaml"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"phonebox/core/multigram_align.py" = ["E741"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
strict_optional = false
exclude = ["venv/", "build/", ".eggs/"]

[[tool.mypy.overrides]]
module = [
    "icu",
    "icukit",
    "yaml",
    "graphviz",
    "matplotlib.*",
    "cartlet",
    "tomli_w",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["phonebox.core.em_align", "phonebox.core.vectorizer"]
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
# Run fast tests first, slow tests last
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["phonebox"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
